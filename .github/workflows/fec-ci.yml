name: FEC CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fec:
    name: 构建与 FEC 测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - name: 格式检查（仅报告）
        run: |
          files="fec.go fec_window.go fec_test.go fec_window_test.go fec_integration_test.go internal/wire/fec_frame.go internal/wire/fec_frame_test.go"
          echo "::group::gofmt 差异"
          gofmt -l ${files} || true
          gofmt -d ${files} || true
          echo "::endgroup::"
      - name: go vet
        run: go vet ./ ./internal/wire/
      - name: 构建
        run: go build ./...
      - name: FEC 单元测试
        run: go test -count=1 -v -run 'FEC|Fec|GF256' ./internal/wire/ ./
      - name: FEC 编解码基准（表 / production / log-exp）
        run: go test -count=1 -run '^$' -bench 'BenchmarkFECRepairRow' -benchtime=2s -benchmem ./
      - name: FEC 集成测试（含竞态检测）
        run: go test -count=1 -race -v -run 'TestFEC.*(Path|LostPackets|Burst)' -timeout 30m ./
      - name: 全部测试
        run: go test -count=1 ./... || true

  arm64:
    name: arm64 交叉编译与等价性（qemu）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - name: 交叉编译检查（linux/arm64）
        run: GOOS=linux GOARCH=arm64 go build ./...
      - name: 安装 qemu-user-static（arm64 测试）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
      - name: arm64 GF(2^8) 等价性测试（qemu）
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/fec-arm64.test ./
          qemu-aarch64-static /tmp/fec-arm64.test -test.run 'TestGF256TableMatchesLogExp|TestFECXORScaledMatchesLogExp' -test.v
